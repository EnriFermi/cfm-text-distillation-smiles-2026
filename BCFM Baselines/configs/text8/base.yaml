dataset:
  name: text8
  data_dir: data/text8
  tokenizer: character
  vocabulary_size: 27
  sequence_length: 256
  reference_split: true
  split_lengths: [351563, 20000, 19063]

model:
  type: null
  data_vocab_size: 27
  mask_token_id: 27
  bos_token_id: 27
  min_time: 0.001
  antithetic_time_sampling: true
  time_conditioning: false
  ignore_bos: false
  mask_rate_min: 0.001
  mask_rate_max: 1.0
  schedule_search: true
  schedule_search_widths: [0.5, 0.6, 0.7, 0.8, 0.9]
  schedule_search_delta: 0.05
  schedule_search_batches: 100
  resample_masked_fraction: true
  backbone:
    vocab_size: 28
    max_sequence_length: 256
    num_layers: 12
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 3072
    time_condition_size: 128
    dropout: 0.1
    rotary_base: 10000.0

training:
  seed: 12345
  # Set for BD3-LM to a compatible checkpoint produced by this repository's
  # MDLM config. BD3_PRETRAIN_CHECKPOINT can override this on Slurm.
  from_pretrained: null
  require_pretrained: false
  device: cuda
  precision: bf16
  # Global batch 2048 sequences = 524,288 tokens/step, matching the CFM
  # reference's 256 x 8 (semicat/configs/data/text8.yaml +
  # experiment/text8_dit_lg.yaml). Only the micro-batch/accumulation split
  # differs per model so each fills ~50GB of an 80GB GPU. This base value targets
  # BD3-LM, which concatenates [noisy, clean] and uses ~2x the memory; ar.yaml and
  # mdlm.yaml override to 256x8. Tune live with BATCH_SIZE / GRAD_ACCUM on Slurm.
  batch_size: 128
  gradient_accumulation_steps: 16
  # WARNING -- COMPUTE. The reference trains Text8 for 500k steps at global batch
  # 2048 = 2.6e11 tokens. Matching it makes a Text8 baseline run ~40x longer than
  # the previous 100k x 256 setting. Override with MAX_STEPS / BATCH_SIZE /
  # GRAD_ACCUM on Slurm to run a shorter, matched-budget comparison instead --
  # but shorten both sides, not just this one.
  max_steps: 500000
  learning_rate: 0.0001
  weight_decay: 0.1
  # Torch defaults, which is what the reference's AdamW gets: it sets only lr and
  # weight_decay.
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  # LinearLR(start_factor=1e-3, total_iters=500), then flat at 1e-4.
  # DEVIATION: these 500 iterations are optimizer steps here. The reference's
  # text8 experiment omits `scheduler_interval`, so SemicatModule's "epoch"
  # default makes them 500 *epochs* (~85k optimizer steps) of warmup -- almost
  # certainly unintended, and not replicated. Its TinyStories experiment sets
  # `scheduler_interval: step` explicitly, which is what this matches.
  warmup_steps: 500
  warmup_start_factor: 0.001
  lr_decay: constant
  gradient_clip_norm: 1.0
  log_every: 10
  # Every 1,250 optimizer steps, as in the reference (val_check_interval 10000
  # micro-batches / accumulate_grad_batches 8).
  validation_every: 1250
  # BD3-LM starts adaptive clipping after 5K optimizer/gradient updates, then
  # repeats the paper's grid search at every validation.
  schedule_search_start_step: 5000
  # Score all 19,745 reference stride-1 windows, like the CFM Text8 loader.
  validation_batches: 309
  evaluation_batch_size: 64
  validation_stride: 1
  checkpoint_every: 1250
  # The reference uses no EMA anywhere, in training or at evaluation; 0 disables
  # it here so neither side gets a smoothing advantage.
  ema_decay: 0.0

sampling:
  length: 256
  batch_size: 128
  strategy: sample
  temperature: 1.0
  top_k: null
  top_p: null
  top_p_include_boundary: true
  seed: 12345
  num_steps: 64
  steps_per_block: null
  first_hitting: false
  sampling_epsilon: 1.0e-5
  noise_removal: true
  cache_denoiser_outputs: true
  use_kv_cache: true
  start_token_id: 27

evaluation:
  # null means every stride-1 test window (18,808 for the reference split).
  likelihood_sample_count: null
  sample_count: 128
  sample_seed: 12345
  diffusion_steps: [16, 32, 64, 128, 256]
  steps_per_block: [1, 2, 4, 8, 16, 32]

# Gen-PPL and MAUVE, measured at every validation and again in the final offline
# evaluation. The Gen-PPL judge is GPT-2 Large under the same masking rule the
# CFM reference uses, so the two methods' numbers are directly comparable.
# Text8 is character-level and space-separated, so GPT-2 scores it as ordinary
# lowercase English without punctuation; the number is only meaningful against
# other models scored the same way, which is exactly the comparison being made.
# num_steps / steps_per_block apply to validation only: they hold every model to
# the same ~64 network evaluations per sample, while `sampling` above keeps the
# full budget for the final evaluation.
generative_evaluation:
  enabled: true
  sample_count: 256
  sampling_batch_size: 64
  seed: 12345
  num_steps: 64
  steps_per_block: 4
  first_hitting: false
  ppl_model: gpt2-large
  ppl_batch_size: 32
  ppl_context_size: null
  mauve_model: gpt2-large
  mauve_reference_count: null
  mauve_scaling_factor: 5.0
  mauve_seed: 12345
  mauve_batch_size: 16
  reference_split: validation
