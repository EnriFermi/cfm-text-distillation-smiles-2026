name: semicat

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23
  - pip:
    - torch==2.7.1
    - torchvision==0.22.1
    - torchdiffeq                # imported by semicat/models/semicat.py (missing upstream)
    - torchmetrics==1.8.2
    - lightning==2.6.0
    - hydra-core
    - hydra-optuna-sweeper
    - hydra-submitit-launcher   # cloud/SLURM sweeps (configs/hydra/launcher/slurm.yaml)
    - comet-ml                  # team experiment tracker (configs/logger/comet.yaml)
    - rich>=13.0
    - hydra-colorlog
    - rootutils
    - pre-commit
    - pytest                    # tests/ (sampler + nfe unit tests)
    - wandb
    - einops==0.8.1
    - datasets==2.19.2
    - transformers==4.41.0
    - jaxtyping==0.3.5
    - timm==1.0.8
    - https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.5.4/flash_attn-2.8.3+cu124torch2.7-cp310-cp310-linux_x86_64.whl
