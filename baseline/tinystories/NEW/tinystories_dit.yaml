defaults:
  - base_text_semicat

in_shape:
  - ${data.max_length}
  - 50257

net:
  _target_: semicat.net.duo.DIT
  vocab_size: 50257
  hidden_size: 384
  cond_dim: 128
  n_blocks: 6
  n_heads: 6
  dropout: 0.1
  length: ${data.max_length}
  embed_type: rms
  # Sequence length 256 makes the portable, forward-AD-compatible PyTorch
  # attention practical for the self-distillation branch.
  jvp_attention_backend: torch
