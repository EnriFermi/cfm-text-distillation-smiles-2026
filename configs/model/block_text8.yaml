# M3 — training-time BCFM model (block-causal DiT + block VFM/ECLD module).
_target_: block.block_semicat.BlockSemicatModule

in_shape:
  - ${data.k}
  - 27

prior_type: gaussian
scheduler: null
sd_type: ecld          # inherited flag; the block ECLD is implemented in BlockSemicatModule
sd_prop: 0.25          # fraction of the batch used for the ECLD term
block_size: 16
ecld_weight: 1.0       # λ on the ECLD loss

net:
  _target_: block.block_dit.BlockDIT
  vocab_size: 27
  hidden_size: 768
  cond_dim: 128
  n_blocks: 12
  n_heads: 12
  dropout: 0.1
  length: ${data.k}
  block_size: ${model.block_size}
  embed_type: rms
