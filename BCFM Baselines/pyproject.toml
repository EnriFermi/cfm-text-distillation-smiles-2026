[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcfm-baselines"
version = "0.1.0"
description = "Comparable AR, MDLM, and BD3-LM text-generation baselines"
requires-python = ">=3.10,<3.14"
# tiktoken supplies the frozen GPT-2 BPE; only data preparation imports it.
# transformers/mauve-text are imported lazily, inside the metric that needs them,
# so likelihood-only runs still work without the judge models installed.
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "omegaconf>=2.3",
    "tiktoken>=0.7",
    "transformers>=4.40,<5",
    "mauve-text>=0.4.0",
    "scikit-learn>=1.3",
    "faiss-cpu>=1.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

