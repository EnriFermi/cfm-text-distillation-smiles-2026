# @package _global_
# M1 — full-sequence CFM baseline on text8 (the reference for H1/H2).
# Canonical recipe = upstream text8_dit_ecld, but logger-agnostic (pick logger on the
# CLI: `logger=comet`). The untouched upstream validation helper uses its
# original GPT-2-large generative-PPL judge.
#
#   python -m semicat.train experiment=cfm_text8_baseline trainer=gpu logger=comet
#
defaults:
  - override /data: text8
  - override /model: text8_dit_lg
  - override /trainer: default

seed: 12345

trainer:
  max_steps: 500000
  val_check_interval: 1000
  check_val_every_n_epoch: null
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-4
    weight_decay: 0.1
  scheduler:
    _target_: torch.optim.lr_scheduler.LinearLR
    _partial_: true
    start_factor: 1e-3
    total_iters: 500
  net:
    length: ${data.k}
    dropout: 0.1
    embed_type: rms
  compile: true
  calc_nll: true
  nll_steps: [1, 2, 4, 8, 32, 64]
  nll_samples: 512
  nll_model_batch_size: 1
  nll_sampling_batch_size: 128
  sd_type: ecld

data:
  batch_size: 128

callbacks:
  # Keep a full, immutable optimization snapshot after every completed eval.
  # This is event-based rather than derived from val_check_interval because
  # validation counts train batches while global_step counts optimizer updates.
  eval_checkpoint:
    _target_: semicat.callbacks.eval_checkpoint.EvalCheckpoint
    dirpath: ${paths.output_dir}/checkpoints/eval
    filename: "eval-step={step:08d}-epoch={epoch:04d}"
    every_n_evals: 1
    save_weights_only: false
    skip_step_zero: true

tags:
  - M1
  - cfm
  - text8
  - baseline-reproduction
  - ecld-1x1
  - full-text8
  - lr1e-4
