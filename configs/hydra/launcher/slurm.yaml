# Cloud / cluster launcher (opt-in). Local runs need nothing — this only kicks in
# when you ask for it AND use multirun, e.g.:
#   python -m eval.run_eval -m hydra/launcher=slurm sampler.block_size=4,8,16
# Requires the hydra-submitit-launcher plugin (in environment.yaml). Override any of
# these on the CLI: hydra.launcher.partition=..., hydra.launcher.gpus_per_node=...
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${paths.log_dir}/submitit/${now:%Y-%m-%d}_${now:%H-%M-%S}
timeout_min: 720
nodes: 1
tasks_per_node: 1
gpus_per_node: 1
cpus_per_task: 8
mem_gb: 64
partition: null
qos: null
