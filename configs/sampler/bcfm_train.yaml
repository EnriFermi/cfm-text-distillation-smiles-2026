# M3: sample the trained block-causal model (block.sampling.block_causal_sample).
name: bcfm_train
block_size: 16          # must match the trained model's block_size
steps_per_block: 2      # flow-map jumps per block; sweep {1,2,4}
discretize: argmax      # or "sample"
schedule: null          # null => uniform grid
