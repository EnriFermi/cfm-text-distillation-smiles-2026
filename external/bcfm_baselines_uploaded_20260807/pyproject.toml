[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcfm-baselines"
version = "0.1.0"
description = "Comparable AR, MDLM, and BD3-LM text-generation baselines"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.4", "numpy>=1.24", "omegaconf>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

