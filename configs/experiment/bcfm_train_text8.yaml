# @package _global_
# M3 — training-time BCFM finetune/train on text8 (block-causal, VFM + ECLD).
#
#   python -m semicat.train experiment=bcfm_train_text8 trainer=gpu logger=comet
#   # ablations: model.sd_type=... (E7 uses block ecld/none), model.sd_prop=... (E8),
#   #            model.block_size=4,8,16 (one trained model per block size)
#
# NOTE: trains from scratch. Finetuning from an M1 checkpoint is not a plain load — the
# block DiT uses manual masked attention + per-token time conditioning, so weight names
# differ from duo.DIT; porting is a separate step (P1.5). For the study we train M3 fresh
# under the same budget as M1 (compute-matched, see docs/experiment_plan.md E2b).
defaults:
  - override /data: text8
  - override /model: block_text8
  - override /trainer: default

seed: 12345

trainer:
  max_steps: 500000
  val_check_interval: 10000
  check_val_every_n_epoch: null
  precision: bf16-mixed
  accumulate_grad_batches: 8
  gradient_clip_val: 1.0

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-4
    weight_decay: 0.1
  scheduler:
    _target_: torch.optim.lr_scheduler.LinearLR
    _partial_: true
    start_factor: 1e-3
    total_iters: 500
  compile: false        # torch.compile can conflict with torch.func.jvp in the ECLD term
  calc_nll: false
  nll_steps: [1, 2, 4]
  nll_samples: 16
  block_size: 16

data:
  batch_size: 256

tags: ["M3", "bcfm", "text8", "train", "ecld"]
