# @package _global_
# M2 inference-time BCFM experiments (BD3-LM masked wrapper over M1).
#
#   python -m eval.run_eval -m ckpt_path=... sampler=bcfm_infer \
#     sampler.block_size=16 sampler.steps_per_block=1,2,4 model_id=M2 \
#     model.net.embed_type=naive +model.sd_type=lag judge_model=EleutherAI/gpt-j-6b \
#     n_samples=256 seed=12345

defaults:
  - override /data: text8
  - override /model: text8_dit_lg

tags: ["M2", "bcfm_infer", "inference-time", "kholkin"]

block_size: 16
steps_per_block: 2
discretize: argmax
prefix: generated
