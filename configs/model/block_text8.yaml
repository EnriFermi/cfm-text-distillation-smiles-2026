# M3 — checkpoint-compatible block CFM model.
_target_: block.block_semicat.BlockSemicatModule

in_shape:
  - ${data.k}
  - 27

prior_type: gaussian
scheduler: null
sd_type: lag           # upstream CFM/Lagrangian loss; override with ecld
sd_prop: 0.25          # exact upstream VFM/self-distillation batch split
block_size: 16
time_eps: 0.0          # torch.rand semantics, identical to upstream SemiCat
init_from_cfm_ckpt: null
expected_source_sd_type: null

net:
  _target_: block.block_dit.BlockDIT
  vocab_size: 27
  hidden_size: 768
  cond_dim: 128
  n_blocks: 12
  n_heads: 12
  dropout: 0.1
  length: ${data.k}
  block_size: ${model.block_size}
  embed_type: naive
  attention_backend: flex
  jvp_attention_backend: auto
  flex_kernel_block_size: 64
